services:
  - type: web
    name: ecommerce-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip uv && uv sync --frozen --no-dev
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PROJECT_NAME
        value: Ecommerce API
      - key: API_V1_STR
        value: /api/v1
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: BACKEND_CORS_ORIGINS
        value: https://ecommerce-frontend.onrender.com
      # Paste these from your external Postgres provider (e.g. Neon, Supabase).
      - key: POSTGRES_SERVER
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: FIRST_SUPERUSER_EMAIL
        sync: false
      - key: FIRST_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: ecommerce-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ecommerce-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
